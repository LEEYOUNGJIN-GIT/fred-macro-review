# states.yaml - 시장 내재 상태·조건부 분포 규칙 (데이터를 보기 전에 고정하는 파일)
#
# 규칙 변경은 곧 가설 변경이다. 이 파일이나 series_catalog.csv가 바뀌면 config_hash가 바뀌고,
# 사전등록 예측(forecast_log.csv)에 해시가 함께 기록되므로 서로 다른 규칙의 채점이 섞이지 않는다.
# 값을 바꾸기 전에 "왜 바꾸는가"를 먼저 기록한다. 과거 데이터에 맞추려는 변경은 과적합이다.

percentile:
  window_bdays: 2520        # 10년(영업일). 문서에 고정하고 회차마다 바꾸지 않는다
  min_bdays: 1260           # 5년 미만이면 상태 미정(NaN)
  hysteresis_hi: 0.60       # 이 백분위 이상으로 올라가야 '높음'으로 전환
  hysteresis_lo: 0.40       # 이 백분위 이하로 내려가야 '낮음'으로 전환 (사이 구간은 직전 상태 유지)

# 상태 축 3개 (전부 개정 없는 시장 일별 시리즈, 발표 시차는 series_catalog.csv의 lag_days)
axes:
  curve:
    label: 커브
    series: [T10Y3M]
    high: 가파름
    low: 평탄·역전
  inflation_expectation:
    label: 물가기대
    series: [T10YIE]
    high: 높음
    low: 낮음
  stress:
    label: 신용·변동성
    series: [BAA10Y, VIXCLS]     # 두 백분위의 평균
    high: 스트레스 높음
    low: 스트레스 낮음

# 시나리오 대상 (예측 지평은 영업일)
targets: [DGS10, DEXKOUS, VIXCLS, BAA10Y, T10YIE, KR10Y, KOSPI, USDKRW_BOK]
horizons_bdays: [21, 63]

# 조건부 분포 검정
test:
  n_perm: 2000              # 환형 시프트 순열검정 횟수 (상태 라벨을 통째로 밀어 자기상관을 보존)
  family_alpha: 0.05        # 조건 수(m)로 나눈 Bonferroni 기준 = family_alpha / m
  min_neff: 8               # 유효 표본(= min(n/지평, 구간 수))이 이보다 작으면 신호로 채택하지 않음

# 확률 산출
probability:
  shrink_k: 30              # [주관 판단] w = n_eff / (n_eff + k). 근거 없는 값이므로 채점 결과로 검증한다
  range_halfwidth: 0.10     # 프로젝트 규칙: 확률은 점이 아니라 범위(±10%p)로 낸다
  bins: tercile             # 하락/횡보/상승 = 전체 표본 변화분의 3분위. 기저율은 구조상 약 1/3

# 검증 게이트: 워크포워드 백테스트(backtest.py)에서 기저율보다 유의하게 나은 (대상, 지평)만
# 공식 확률에 신호를 반영한다. 나머지는 기저율을 공식 값으로 쓰고 모형 값은 '참고'로만 병기한다.
# 주의: 이 게이트는 백테스트 전체를 본 뒤 정한 것이라 표본 내 선택이다.
#       진짜 검증은 forecast_log.csv의 사전등록 채점(공식값 vs 모형값 vs 기저율)이다.
validation:
  min_z: 2.0                # 평균 Brier 차이 / 표준오차가 이 값 이상이고 BSS > 0
  summary_file: data/macro/backtest_summary.csv

# 사전등록 예측: ISO 주마다 그 주의 첫 실행 때 대상 x 지평 전부를 append-only로 등록한다
forecast:
  log_file: data/macro/forecast_log.csv
