# ═══════════════════════════════════════════════════════════
# State Layer — 국면 6개 지표와 시세표 (expert_view 시장 갱신의 기준 수치)
# ═══════════════════════════════════════════════════════════
# Schedule: 미국 정규장 마감(KST 06:00, 서머타임 05:00) 뒤
# 예약 작업(06:30)은 이 파일이 늦게 오면 같은 스크립트를 직접 실행한다
# 외부 패키지 없음 — state_fetch.py는 표준 라이브러리만 쓴다

name: State Daily

on:
  schedule:
    - cron: "17 21 * * 1-5"         # UTC 21:17 Mon-Fri = KST 06:17 Tue-Sat
    - cron: "43 23 * * 1-5"         # 보강 실행 (KST 08:43, 한국장 개장 전 재계산)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute state
        run: python state_fetch.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/state_latest.md data/state_latest.json

          git diff --cached --quiet && echo "No changes to commit" && exit 0

          TIMESTAMP=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')
          git commit -m "State daily update — ${TIMESTAMP}"
          git pull --rebase origin main
          git push
